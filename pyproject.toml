[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distfuzz"
version = "0.1.0"
description = "Fuzzers for torch.distributed, DTensor and distributed checkpointing"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Temilola Olowolayemo" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "PIE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
