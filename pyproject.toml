[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distfuzz"
version = "0.1.0"
description = "Fuzzers for torch.distributed, DTensor and distributed checkpointing"
readme = "README.md"
license = { text = "Proprietary. All rights reserved." }
authors = [{ name = "Temilola Olowolayemo" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"distfuzz.repro" = ["Dockerfile.torch"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "PIE"]
# dict(k=v) reads better for records; zip(strict=) would change behavior on ragged inputs
ignore = ["C408", "B905"]

[tool.ruff.lint.per-file-ignores]
# emitted repro source and report HTML are string templates
"src/distfuzz/repro/{gen_distfuzz,gen_dtensor,render}.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = ["multirank: starts several torch.distributed ranks (Docker only, see `make docker-test`)"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
